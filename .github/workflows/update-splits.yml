name: Update DraftKings betting splits
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: draftkings-splits
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Retrieve available public moneyline splits
        shell: bash
        run: |
          for league in NBA NFL MLB; do
            echo "Checking $league..."
            python scripts/update_splits.py --league "$league" || echo "No verified $league update; prior snapshot retained."
          done
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Refresh DraftKings betting splits" && git push)
