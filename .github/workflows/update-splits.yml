name: Update DraftKings betting splits
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: draftkings-splits
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Retrieve available public moneyline splits
        shell: bash
        run: |
          for league in NBA NFL MLB; do
            echo "Checking $league..."
            python scripts/update_splits.py --league "$league" || echo "No verified $league update; prior snapshot retained."
          done
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh DraftKings betting splits"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Data conflict; refusing to overwrite newer changes."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published updated betting splits."
                exit 0
              fi
              echo "Push raced with another commit; retrying"
              sleep 3
            done
            exit 1
          else
            echo "No data changes to commit."
          fi
